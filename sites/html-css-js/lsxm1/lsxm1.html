<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系我们</title>
    <!-- 原先引用的 https://kit.fontawesome.com/64d58efce2.js 已返回 403，
         社交图标改为内联 SVG，去掉此外部依赖 -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800&display=swap");
      *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,input,textarea{
        font-family: "Poppins", sans-serif;
      }
      .container{
        position: relative;
        width: 100%;
        min-height: 100vh;
        padding: 2rem;
        background-color: #fafafa;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .form{
        width: 100%;
        max-width: 820px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 20px 1px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .contact-form{
        background-color: #1abc9c;
        position: relative;
      }
      .circle{
        border-radius: 50%;
        background: linear-gradient(135deg,transparent 20%,#149279);
        position: absolute;
      }
      .circle.one{
        width: 130px;
        height: 130px;
        top: 130xp;
        right: -40px;
      }
      .circle.two{
        width: 80px;
        height: 80px;
        top:10px;
        right: 30px;
      }
      .contact-form::before{
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        background-color: #1abc9c;
        transform: rotate(45deg);
        top: 50px;
        left: -10px;
      }
      form{
        padding: 2.3rem;
        z-index: 10;
        overflow: hidden;
        position: relative;
      }
      .title{
        color: #fff;
        font-weight: 500;
        font-size: 1.5rem;
        line-height: 1;
        margin-bottom: 0.7rem;
      }
      .input-container{
        position: relative;
        margin: 1rem 0;
      }
      .input{
        width: 100%;
        outline: none;
        border: 2px solid #fafafa;
        background: none;
        padding: 0.6rem 1.2rem;
        color: #fff;
        font-weight: 500;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        border-radius: 25px;
        transition: 0.3s;
      }
      textarea.input{
        padding: 0.8rem 1.2rem;
        min-height: 150px;
        border-radius: 22px;
        resize: none;
        overflow-y: auto;
      }
      .input-container label{
        position: absolute;
        top: 23px;
        left: 15px;
        transform: translateY(-50%);
        padding: 0 0.4rem;
        font-size: 0.9rem;
        color: #fafafa;
        font-weight: 400;
        pointer-events: none;
        z-index: 1000;
        transition: 0.5s;
      }
      .input-container textarea label{
        top: 1rem;
        transform: translateY(0);
      }
      .btn{
        padding: 0.6rem 1.3rem;
        background-color: #fff;
        border: 2px solid #fafafa;
        font-size: 0.95rem;
        color: #1abc9c;
        line-height: 1;
        border-radius: 25px;
        outline: none;
        cursor: pointer;
        transition: 0.3s;
        margin: 0;
      }
      .btn:hover{
        background-color: transparent;
        color: #fff;
      }
      .input-container span{
        position: absolute;
        top: 0;
        left: 25px;
        transform: translateY(-50%);
        font-size: 0.8rem;
        padding: 0 0.4rem;
        color: transparent;
        pointer-events: none;
        z-index: 500;
      }
      .input-container span::before,.input-container span::after{
        content: '';
        position: absolute;
        opacity: 0;
        width: 10%;
        transition: 0.3s;
        height: 5px;
        background-color: #1abc9c;
        top: 50%;
        transform: translateY(-50%);
      }
      .input-container span::before{
        left: 50%;
      }
      .input-container span::after{
        right: 50%;
      }
      .input-container.focus label{
        top: 0%;
        transform: translateY(-50%);
        left: 25px;
        font-size: 0.8rem;
      }
      .input-container.focus span::before,
      .input-container.focus span::after{
        width: 50%;
        opacity: 1;
      }
      .contact-info{
        padding: 2.3rem 2.2rem;
        position: relative;
      }
      .contact-info .title{
        color: #1abc9c;
      }
      .text{
        color: #333;
        margin: 1.5rem 0 2rem 0;
      }
      .information{
        display: flex;
        color: #555;
        margin: 0.7rem 0;
        align-items: center;
        font-size: 0.95rem;
      }
      .icon{
        width: 20px;
        margin-right: 0.7rem;
      }
      .social-media{
        padding: 2rem 0 0 0;
      }
      .social-media p{
        color: #333;

      }
      .social-icons{
        display: flex;
        margin-top: 0.5rem;
      }
      .social-icons a{
        display: flex;
        align-items: center;
        justify-content: center;
        width: 35px;
        height: 35px;
        border-radius: 5px;
        background: linear-gradient(45deg,#1abc9c,#149279);
        color: #fff;
        margin-right: 0.5rem;
        transition: 0.3s;
      }
      /* 图标由字体改为内联 SVG 后，尺寸需显式指定 */
      .social-icons svg{
        width: 17px;
        height: 17px;
      }
      .social-icons a:hover{
        transform: scale(1.05);
      }
      .contact-info::before{
        content: '';
        position: absolute;
        width: 110px;
        height: 100px;
        border: 22px solid #1abc9c;
        border-radius: 50%;
        bottom: -77px;
        right: 50px;
        opacity: 0.3;
      }
      .big-circle{
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: linear-gradient(180deg,#1cd4af,#159b80);
        bottom: 50%;
        right: 50%;
        transform: translate(-40%,35%);
      }
      .big-circle::after{
        content: '';
        position: absolute;
        width: 360px;
        height: 360px;
        background-color: #fafafa;
        border-radius: 50%;
        top: calc(50% - 180px);
        left: calc(50% - 180px);
      }
      .square{
        position: absolute;
        height: 400px;
        top: 50%;
        left: 50%;
        transform: translate(181%,11%);
        opacity: 0.2;
      }
      @media (max-width:850px) {
        .form {
            grid-template-columns: 1fr;
        }
        .contact-info:before {
            bottom: initial;
            top: -75px;
            right: 65px;
            transform: scale(0.95);
        }
        .contact-form:before {
            top: -13px;
            border-left-style: initial;
            right: 70px;
        }
        .square {
            transform: translate((140%, 43%));
            height: 350px;
        }
        .big-circle {
            bottom: 75%;
            transform: scale(0.9) translate(-40%, 30%);
            right: 50%;
        }
        .text {
            margin: 1rem 0 1.5rem 0;
        }
        .social-media {
            padding: 1.5rem 0 0 0;
        }
    }
    
    @media (max-width: 480px) {
        .container {
            padding: 1.5rem;
        }
        .contact-info:before {
            display: none;
        }
        .square,
        .big-circle {
            display: none;
        }
        form,
        .contact-info {
            padding: 1.7rem 1.6rem;
        }
        .text,
        .information,
        .social-media p {
            font-size: 0.8rem;
        }
        .title {
            font-size: 1.15rem;
        }
        .social-icons a {
            width: 30px;
            height: 30px;
            line-height: 30px;
        }
        .icon {
            width: 23px;
        }
        .input {
            padding: 0.45rem 1.2rem;
        }
        .btn {
            padding: 0.45rem 1.2rem;
        }
    }
    </style>
      <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="container">
      <span class="big-circle"></span>
      <img src="shape.png" class="square" />
      <div class="form">
        <div class="contact-info">
          <h3 class="title">Let's get in touch</h3>
          <p class="text">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Saepe
            dolorum adipisci recusandae praesentium dicta!
          </p>

          <div class="info">
            <div class="information">
              <img src="location.png" class="icon" />
              <p>wz</p>
            </div>
            <div class="information">
              <img src="email.png" class="icon" />
              <p>409282151@qq.com</p>
            </div>
            <div class="information">
              <img src="phone.png" class="icon" />
              <p>15827469443</p>
            </div>
          </div>
          <div class="social-media">
            <p>Connect with us :</p>
            <div class="social-icons">
              <a href="#" aria-label="Facebook">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.4 21v-7.2h2.4l.36-2.8h-2.76V9.2c0-.8.22-1.35 1.37-1.35h1.47V5.34c-.25-.03-1.12-.1-2.13-.1-2.11 0-3.56 1.28-3.56 3.65v2.03H8.1v2.8h2.45V21z"/></svg>
              </a>
              <a href="#" aria-label="Twitter">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 6.2c-.7.31-1.46.52-2.25.62.81-.49 1.43-1.26 1.72-2.18-.76.45-1.6.78-2.49.95a3.92 3.92 0 0 0-6.68 3.57A11.13 11.13 0 0 1 3.8 5.1a3.92 3.92 0 0 0 1.21 5.23c-.64-.02-1.24-.2-1.77-.49v.05c0 1.9 1.35 3.48 3.15 3.84-.33.09-.68.14-1.04.14-.25 0-.5-.02-.74-.07a3.92 3.92 0 0 0 3.66 2.72A7.86 7.86 0 0 1 2.4 18.2a11.09 11.09 0 0 0 6.01 1.76c7.21 0 11.15-5.97 11.15-11.15l-.01-.51c.77-.55 1.43-1.24 1.95-2.03z"/></svg>
              </a>
              <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.6"/><circle cx="12" cy="12" r="3.7"/><circle cx="16.9" cy="7.1" r="1.05" fill="currentColor" stroke="none"/></svg>
              </a>
              <a href="#" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.1 9.1H4.3V19h2.8zM5.7 4.3a1.62 1.62 0 1 0 0 3.25 1.62 1.62 0 0 0 0-3.25zM19.7 19v-5.9c0-3.03-1.62-4.44-3.78-4.44-1.74 0-2.52 1-2.95 1.62V9.1h-2.8V19h2.8v-5.82c0-1.5.79-2.2 1.77-2.2s1.68.7 1.68 2.2V19z"/></svg>
              </a>
            </div>
          </div>
        </div>
        <div class="contact-form">
          <span class="circle one"></span>
          <span class="circle two"></span>

          <form action="lsxm1.html" autocomplete="off">
            <h3 class="title">Contact us</h3>
            <div class="input-container">
              <input type="text" name="name" class="input" />
              <label for="">Username</label>
              <span>Username</span>
            </div>
            <div class="input-container">
              <input type="email" name="email" class="input" />
              <label for="">Email</label>
              <span>Email</span>
            </div>
            <div class="input-container">
              <input type="tel" name="phone" class="input" />
              <label for="">Phone</label>
              <span>Phone</span>
            </div>
            <div class="input-container textarea">
              <textarea name="message" class="input"></textarea>
              <label for="">Message</label>
              <span>Message</span>
            </div>
            <input type="submit" value="Send" class="btn"></input>
          </form>
        </div>
      </div>
    </div>

    <script>
      const inputs = document.querySelectorAll('.input')
      function focusFunc(){
        let parent = this.parentNode
        parent.classList.add('focus')
      }
      function blurFunc(){
        let parent = this.parentNode
        if(this.value === ''){
        parent.classList.remove('focus')
        }
      }
      inputs.forEach(input=>{
        input.addEventListener('focus',focusFunc)
        input.addEventListener('blur',blurFunc)
      })
    </script>
  </body>
</html>
