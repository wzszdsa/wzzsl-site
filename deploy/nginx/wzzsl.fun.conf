# ============================================================
#  wzzsl.fun — Nginx 站点配置
# ------------------------------------------------------------
#  部署位置：/etc/nginx/conf.d/wzzsl.fun.conf
#  证书：Let's Encrypt 泛域名证书 *.wzzsl.fun（DNS-01 校验）
#
#  目录约定（服务器上）：
#    /srv/wzzsl/<site>/          静态站点产物
#    Node 服务由 systemd 托管，监听回环地址
#
#  子域路由总表：
#    wzzsl.fun           → /srv/wzzsl/portal/        （门户）
#    todo.wzzsl.fun      → /srv/wzzsl/todo/          （Vite SPA）
#    box.wzzsl.fun       → /srv/wzzsl/box/           （原生 JS）
#    demo.wzzsl.fun      → /srv/wzzsl/demo/          （静态合集）
#    days.wzzsl.fun      → /srv/wzzsl/days/          （Vite SPA）
#    yijian.wzzsl.fun    → /srv/wzzsl/yijian/  + 127.0.0.1:3101（/api/）
#    petcare.wzzsl.fun   → 127.0.0.1:3102            （Next.js）
# ============================================================

# ---------- HTTP 一律跳转 HTTPS ----------
server {
    listen      80;
    listen      [::]:80;
    server_name wzzsl.fun *.wzzsl.fun;

    # 保留 ACME 校验路径（证书续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 公共 SSL 参数（通过 include 复用）----------
# 说明：以下四行在每个 HTTPS server 块中重复出现，便于单文件部署。
#       certbot 续期后无需改动本文件。

# ============================================================
#  门户 —— wzzsl.fun
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    root  /srv/wzzsl/portal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
#  待办清单 —— todo.wzzsl.fun（Vite SPA，需前端路由回退）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         todo.wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    root  /srv/wzzsl/todo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
#  推箱子 —— box.wzzsl.fun（原生 JS 静态站）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         box.wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    root  /srv/wzzsl/box;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|ico|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
#  前端练习合集 —— demo.wzzsl.fun（多目录静态站）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         demo.wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    root  /srv/wzzsl/demo;
    index index.html;

    # 自动索引：练习合集目录较多，便于浏览
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
#  纪念日 —— days.wzzsl.fun（Vite SPA + PWA）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         days.wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    root  /srv/wzzsl/days;
    index index.html;

    # Service Worker 不可长缓存，否则更新不生效
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
#  驿见快递查询 —— yijian.wzzsl.fun
#  静态前端 + Node API（/api/* 反代到 127.0.0.1:3101）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         yijian.wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    root  /srv/wzzsl/yijian;
    index index.html;

    client_max_body_size 2m;

    # API 反代到 Node 服务
    location /api/ {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
#  宠物预约 —— petcare.wzzsl.fun（Next.js，全量反代）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         petcare.wzzsl.fun;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================================
#  兜底：未匹配的子域一律回门户，避免暴露默认站点
# ============================================================
server {
    listen              443 ssl default_server;
    listen              [::]:443 ssl default_server;
    server_name         _;

    ssl_certificate     /etc/letsencrypt/live/wzzsl.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wzzsl.fun/privkey.pem;

    return 301 https://wzzsl.fun$request_uri;
}
