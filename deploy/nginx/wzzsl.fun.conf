# ============================================================
#  wzzsl.fun — Nginx 站点配置
# ------------------------------------------------------------
#  部署位置：/etc/nginx/conf.d/wzzsl.fun.conf
#  目标主机：47.76.244.209（Alibaba Cloud Linux 4，Nginx 1.30.4）
#
#  证书：沿用 /etc/nginx/ssl/wzzsl.fun.*（由 acme.sh 管理并自动续期）
#        改用多 SAN 方式覆盖全部子域，见 docs/deployment.md 第一节。
#        注意 acme.sh 的 --key-file/--fullchain-file 需指向同样的路径，
#        否则续期后 Nginx 读到的仍是旧证书。
#
#  目录约定（服务器上）：
#    /srv/wzzsl/<site>/     静态站点产物
#    Node 服务由 systemd 托管，监听回环地址
#
#  子域路由总表：
#    wzzsl.fun           → /srv/wzzsl/portal/          （门户）
#    todo.wzzsl.fun      → /srv/wzzsl/todo/            （Vite SPA）
#    box.wzzsl.fun       → /srv/wzzsl/box/             （原生 JS）
#    demo.wzzsl.fun      → /srv/wzzsl/demo/            （静态合集）
#    days.wzzsl.fun      → /srv/wzzsl/days/            （Vite SPA）
#    yijian.wzzsl.fun    → /srv/wzzsl/yijian/  + 127.0.0.1:3000（/api/）
#    petcare.wzzsl.fun   → 127.0.0.1:3102              （Next.js）
#
#  说明：驿见沿用服务器上既有的 yijian.service（/opt/yijian，端口 3000），
#        本仓库 deploy/yijian-adapter 为备选实现，当前未启用。
# ============================================================

# ============================================================
#  全局字符集声明
# ------------------------------------------------------------
#  必须显式声明，否则中文会乱码。原因：nginx 自动生成的目录索引页
#  （autoindex）既不发送 charset 响应头，HTML 里也不含 <meta charset>，
#  浏览器只能回退到默认编码（中文 Windows 下常为 GBK/1252）解析，
#  于是 UTF-8 的中文文件名显示为乱码。
#
#  该指令位于 http 上下文（conf.d 下的文件整体被 include 进 http 块），
#  因此对所有 server 块生效。实测本项目全部文件均为 UTF-8 或 ASCII，
#  不存在被错误转码的风险。
# ============================================================
charset       utf-8;
charset_types text/html text/xml text/plain text/css
              text/javascript application/javascript application/json;

# ============================================================
#  80 端口：ACME 校验 + 全量跳转 HTTPS
#  校验路径必须留在 80 且不跳转，否则证书无法自动续期。
#  注意 server_name 需覆盖子域，否则新子域签发时会 404。
# ============================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name wzzsl.fun *.wzzsl.fun _;

    location /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  门户 —— wzzsl.fun
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         wzzsl.fun;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /srv/wzzsl/portal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
#  待办清单 —— todo.wzzsl.fun（Vite SPA，需前端路由回退）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         todo.wzzsl.fun;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /srv/wzzsl/todo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
