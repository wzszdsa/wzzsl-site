# ============================================================
#  前端练习合集 —— demo.wzzsl.fun（多目录静态站）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         demo.wzzsl.fun;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /srv/wzzsl/demo;
    index index.html;

    # 练习合集目录较多，开启目录索引便于浏览
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
#  纪念日 —— days.wzzsl.fun（Vite SPA + PWA）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         days.wzzsl.fun;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /srv/wzzsl/days;
    index index.html;

    # Service Worker 不可长缓存，否则更新不生效
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
#  驿见快递查询 —— yijian.wzzsl.fun
#  静态前端 + 反代既有 yijian.service（127.0.0.1:3000）
#  该服务原挂在根域，本次迁至子域；服务本身不做改动。
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         yijian.wzzsl.fun;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /srv/wzzsl/yijian;
    index index.html;

    client_max_body_size 2m;

    # API 反代到既有服务（端口 3000，非本仓库适配层的 3101）
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ============================================================
#  宠物预约 —— petcare.wzzsl.fun（Next.js，全量反代）
# ============================================================
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         petcare.wzzsl.fun;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================================
#  兜底：未匹配的子域一律回门户，避免暴露默认站点
#  注意：80 端口已用 default_server 承接 ACME，此处仅针对 443。
# ============================================================
server {
    listen              443 ssl default_server;
    listen              [::]:443 ssl default_server;
    server_name         _;

    ssl_certificate     /etc/nginx/ssl/wzzsl.fun.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzzsl.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://wzzsl.fun$request_uri;
}
